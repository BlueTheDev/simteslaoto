<!DOCTYPE html>
<html lang="de" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no">
  <title>Nova Dash • EV Cockpit Simulator</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --accent: #4f8cff;
      --accent-2: #17e3c5;
      --amber: #ffb020;
      --red: #ff4d5e;
      --ff-display: 'Space Grotesk', sans-serif;
      --ff-ui: 'Inter', sans-serif;
      --brightness: 1;
    }
    html[data-theme="dark"] {
      --bg: #020304;
      --panel: #0b0c0f;
      --panel-2: #131519;
      --panel-3: #1b1e24;
      --line: #24272e;
      --text: #f3f4f6;
      --text-dim: #8b909c;
      --text-dimmer: #565a63;
      --overlay-bg: rgba(4,5,7,.97);
      --map-filter: saturate(.85) brightness(.9);
      --shadow: 0 20px 50px rgba(0,0,0,.5);
    }
    html[data-theme="light"] {
      --bg: #eef0f3;
      --panel: #ffffff;
      --panel-2: #f5f6f8;
      --panel-3: #e9ebef;
      --line: #dde1e6;
      --text: #14161a;
      --text-dim: #5c626c;
      --text-dimmer: #9aa0aa;
      --overlay-bg: rgba(255,255,255,.97);
      --map-filter: saturate(1.05) brightness(1.03);
      --shadow: 0 20px 50px rgba(20,22,26,.14);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; overscroll-behavior: none; }
    body {
      font-family: var(--ff-ui);
      background: var(--bg);
      color: var(--text);
      width: 100vw; height: 100vh; height: 100dvh;
      overflow: hidden;
      -webkit-font-smoothing: antialiased;
    }
    button, input { font-family: inherit; color: inherit; }
    .screen {
      position: fixed; inset: 0;
      background: var(--bg);
      overflow: hidden;
      display: grid;
      grid-template-rows: auto 1fr auto;
      filter: brightness(var(--brightness,1));
      transition: filter .25s ease, background .3s ease;
    }
    /* TOP BAR */
    .topbar {
      display: grid;
      grid-template-columns: 34% 1fr;
      align-items: center;
      padding: 10px 20px;
      z-index: 20;
      border-bottom: 1px solid var(--line);
    }
    .top-left { display: flex; align-items: center; gap: 18px; }
    .top-right { display: flex; align-items: center; justify-content: flex-end; gap: 12px; font-size: 13px; color: var(--text-dim); }
    .icon-btn {
      background: none; border: none; color: var(--text-dim); cursor: pointer;
      display: flex; align-items: center; justify-content: center; padding: 5px;
      border-radius: 8px; transition: color .15s, background .15s; position: relative;
    }
    .icon-btn svg { width: 19px; height: 19px; }
    .icon-btn:hover { color: var(--text); background: var(--panel-2); }
    .icon-btn.on { color: var(--accent); }
    .icon-btn.danger { color: var(--red); }
    .divider { width: 1px; height: 16px; background: var(--line); }
    .clock { font-variant-numeric: tabular-nums; font-weight: 600; color: var(--text); min-width: 64px; text-align: right; }
    .profile-btn {
      display: flex; align-items: center; gap: 8px; background: none; border: none; cursor: pointer; color: var(--text);
      padding: 4px 8px 4px 4px; border-radius: 20px;
    }
    .profile-avatar {
      width: 24px; height: 24px; border-radius: 50%; background: linear-gradient(135deg,var(--accent),#7b2ff7);
      display: flex; align-items: center; justify-content: center; font-size: 10px; font-weight: 800; color: #fff;
    }
    /* MAIN */
    .main {
      display: grid;
      grid-template-columns: 34% 1fr;
      position: relative;
      min-height: 0;
    }
    /* CLUSTER */
    .cluster {
      padding: 12px 24px 14px;
      display: flex;
      flex-direction: column;
      align-items: center;
      border-right: 1px solid var(--line);
    }
    .speed-row { align-self: flex-start; display: flex; align-items: baseline; gap: 12px; width: 100%; }
    .speed-num { font-family: var(--ff-display); font-weight: 700; font-size: 48px; line-height: 1; }
    .speed-unit { font-size: 12px; color: var(--text-dim); font-weight: 600; }
    .gear-row { align-self: flex-start; display: flex; align-items: center; gap: 14px; width: 100%; margin: 6px 0 8px; }
    .gear-letters { display: flex; gap: 10px; font-weight: 700; font-size: 14px; color: var(--text-dimmer); }
    .gear-letters button {
      background: none; border: none; color: inherit; cursor: pointer;
      width: 24px; height: 24px; border-radius: 6px;
    }
    .gear-letters button.active { color: var(--bg); background: var(--text); }
    .range-wrap { margin-left: auto; display: flex; align-items: center; gap: 8px; }
    .batt { width: 26px; height: 13px; border: 1.5px solid var(--text-dim); border-radius: 3px; position: relative; padding: 1.5px; }
    .batt::after { content: ''; position: absolute; right: -4px; top: 3px; width: 2px; height: 5px; background: var(--text-dim); border-radius: 1px; }
    .batt-fill { height: 100%; border-radius: 1px; background: var(--accent-2); width: 82%; }
    .model-label { align-self: flex-start; font-size: 12px; letter-spacing: .14em; color: var(--text-dim); font-weight: 700; margin: 4px 0; }
    .car-stage { width: 100%; max-width: 180px; flex: 1; display: flex; align-items: center; justify-content: center; }
    /* NAV */
    .navpanel { position: relative; overflow: hidden; }
    #map { position: absolute; inset: 0; z-index: 1; filter: var(--map-filter); }
    .navigate-bar {
      position: absolute; top: 14px; left: 16px; right: 16px; z-index: 15;
      background: var(--overlay-bg); backdrop-filter: blur(6px);
      border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px;
      display: flex; align-items: center; gap: 10px; cursor: pointer; color: var(--text-dim);
      font-weight: 500; font-size: 14px; box-shadow: var(--shadow);
    }
    /* BOTTOM DOCK */
    .dock {
      display: flex; align-items: center; justify-content: space-between;
      padding: 8px 18px 12px; gap: 4px; z-index: 20; border-top: 1px solid var(--line);
    }
    .temp-side { display: flex; flex-direction: column; align-items: center; padding: 0 6px; }
    .temp-side button { background: none; border: none; color: var(--text-dim); cursor: pointer; padding: 2px; font-size: 14px; }
    .temp-val { font-family: var(--ff-display); font-size: 17px; font-weight: 600; }
    .start-btn {
      width: 44px; height: 44px; border-radius: 50%;
      background: linear-gradient(135deg,var(--accent),var(--accent-2));
      border: none; color: #fff; cursor: pointer; display: flex; align-items: center; justify-content: center;
      box-shadow: 0 8px 20px rgba(79,140,255,.35); transition: transform .15s;
    }
    .start-btn:hover { transform: scale(1.05); }

    /* START MENU */
    .startmenu-overlay {
      position: absolute; inset: 0; z-index: 75; background: var(--overlay-bg); backdrop-filter: blur(14px);
      display: flex; align-items: flex-end; justify-content: center;
      opacity: 0; pointer-events: none; transition: opacity .22s ease;
    }
    .startmenu-overlay.show { opacity: 1; pointer-events: auto; }
    .startmenu-panel {
      width: min(640px, 92%); margin-bottom: 100px; background: var(--panel-3); border: 1px solid var(--line);
      border-radius: 20px; padding: 26px 28px 22px; box-shadow: var(--shadow);
      transform: translateY(24px) scale(.97); transition: transform .22s ease;
    }
    .startmenu-overlay.show .startmenu-panel { transform: translateY(0) scale(1); }
    .startmenu-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 14px; }
    .app-tile {
      display: flex; flex-direction: column; align-items: center; gap: 10px; padding: 16px 6px;
      background: var(--panel-2); border: 1px solid var(--line); border-radius: 16px; cursor: pointer;
      transition: .15s;
    }
    .app-tile:hover { border-color: var(--accent); transform: translateY(-2px); }
    .app-tile .aticon {
      width: 44px; height: 44px; border-radius: 13px; display: flex; align-items: center; justify-content: center; color: #fff; font-size: 22px;
    }
    .app-tile .alabel { font-size: 11px; font-weight: 700; color: var(--text-dim); }

    /* APP OVERLAYS */
    .app-overlay {
      position: absolute; inset: 0; z-index: 70; background: var(--overlay-bg); backdrop-filter: blur(10px);
      transform: translateY(100%); transition: transform .3s ease; padding: 22px 30px; display: flex; flex-direction: column;
    }
    .app-overlay.show { transform: translateY(0); }
    .app-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px; }
    .app-head h3 { font-size: 18px; font-weight: 700; }
    .closebtn { width: 34px; height: 34px; border-radius: 9px; background: var(--panel-2); border: 1px solid var(--line); color: var(--text-dim); cursor: pointer; }

    .camera-grid { flex: 1; display: grid; grid-template-columns: 1fr 1fr; grid-template-rows: 1fr 1fr; gap: 14px; }
    .cam-feed { background: #0a0b0d; border: 1px solid var(--line); border-radius: 14px; display: flex; align-items: center; justify-content: center; font-weight: 700; color: var(--text-dim); }

    .settings-overlay {
      position: absolute; inset: 0; z-index: 70; display: flex;
      transform: translateX(100%); transition: transform .32s cubic-bezier(.2,.8,.2,1);
      background: var(--overlay-bg); backdrop-filter: blur(10px);
    }
    .settings-overlay.show { transform: translateX(0); }
    .settings-content { flex: 1; padding: 22px 30px; overflow-y: auto; }
    .settings-sidebar { width: 220px; border-left: 1px solid var(--line); padding: 22px 14px; display: flex; flex-direction: column; gap: 2px; }
    .side-item {
      display: flex; align-items: center; gap: 12px; padding: 11px 12px; border-radius: 10px; cursor: pointer;
      color: var(--text-dim); font-size: 13.5px; font-weight: 600;
    }
    .side-item.active { color: var(--text); background: var(--panel-2); }
    .update-card { border: 1px solid var(--accent); background: rgba(79,140,255,.08); border-radius: 14px; padding: 16px; margin-top: 14px; }
    .update-card .ubtn { background: var(--accent); border: none; color: #fff; font-weight: 700; padding: 11px 16px; border-radius: 9px; cursor: pointer; width: 100%; margin-top: 8px; }

    .toast-stack { position: absolute; top: 70px; left: 50%; transform: translateX(-50%); z-index: 200; display: flex; flex-direction: column; gap: 8px; align-items: center; }
    .toast {
      background: var(--overlay-bg); border: 1px solid var(--line); backdrop-filter: blur(8px);
      padding: 11px 18px; border-radius: 11px; font-size: 13px; font-weight: 600; animation: toastin .25s ease;
    }
    @keyframes toastin { from { opacity: 0; transform: translateY(-8px); } to { opacity: 1; transform: translateY(0); } }
  </style>
</head>
<body>
<div class="screen" id="screen">
  <div class="topbar">
    <div class="top-left">
      <span class="icon-btn" title="Reifendruck"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="8"/></svg></span>
    </div>
    <div class="top-right">
      <button class="profile-btn"><span class="profile-avatar">F1</span><span class="profile-name">Fahrer 1</span></button>
      <div class="divider"></div>
      <button class="icon-btn on" id="btnBt"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M7 7l10 10-5 5V2l5 5L7 17"/></svg></button>
      <button class="icon-btn" id="btnSentry"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 3l7 3v6c0 5-3 8-7 9-4-1-7-4-7-9V6l7-3z"/></svg></button>
      <button class="icon-btn" id="btnTheme"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="5"/></svg></button>
      <div class="divider"></div>
      <span class="clock" id="clock">--:--</span>
    </div>
  </div>

  <div class="main">
    <div class="cluster">
      <div class="speed-row"><span class="speed-num" id="speedNum">0</span><span class="speed-unit">km/h</span></div>
      <div class="gear-row">
        <div class="gear-letters" id="gearLetters">
          <button data-g="P" class="active">P</button><button data-g="R">R</button><button data-g="N">N</button><button data-g="D">D</button>
        </div>
        <div class="range-wrap"><span class="range-mi" id="rangeMi">434km</span><div class="batt"><div class="batt-fill" id="battFill" style="width:82%"></div></div></div>
      </div>
      <div class="model-label">MODEL 3</div>
      <div class="car-stage"><svg class="car-svg" viewBox="0 0 200 380"><path d="M60 30 Q100 8 140 30 L152 70 L158 140 L160 260 Q160 300 140 320 L120 335 Q100 342 80 335 L60 320 Q40 300 40 260 L42 140 L48 70 Z" fill="#242830" stroke="#3a3f48" stroke-width="1.6"/></svg></div>
    </div>

    <div class="navpanel">
      <div id="map"></div>
      <div class="navigate-bar"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" width="17" height="17"><path d="M3 11l18-8-8 18-2-8-8-2z"/></svg><span>Navigieren</span></div>
    </div>

    <!-- START MENU -->
    <div class="startmenu-overlay" id="startMenuOverlay">
      <div class="startmenu-panel">
        <div class="startmenu-grid" id="startMenuGrid"></div>
        <div style="margin-top:20px; display:flex; justify-content:flex-end;">
          <button id="startMenuClose" style="background:var(--panel-2); border:1px solid var(--line); color:var(--text); padding:8px 18px; border-radius:8px;">Schließen</button>
        </div>
      </div>
    </div>

    <!-- CAMERA APP -->
    <div class="app-overlay" id="cameraOverlay">
      <div class="app-head"><h3>Kamera</h3><button class="closebtn" id="cameraClose"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>
      <div class="camera-grid"><div class="cam-feed">📷 FRONT</div><div class="cam-feed">📷 HECK</div><div class="cam-feed">📷 LINKS</div><div class="cam-feed">📷 RECHTS</div></div>
    </div>

    <!-- SPOTIFY MEDIA APP -->
    <div class="app-overlay" id="mediaOverlay">
      <div class="app-head"><h3>Spotify</h3><button class="closebtn" id="mediaClose"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>
      <div style="flex:1; display:flex; align-items:center; justify-content:center; flex-direction:column; gap:20px;">
        <div style="font-size:64px;">🎵</div>
        <div style="font-weight:700; font-size:18px;">Solar Drift</div>
        <div style="color:var(--text-dim);">Nova Waves</div>
        <div style="display:flex; gap:20px; margin-top:10px;">
          <button id="prevTrack" style="background:none; border:none; font-size:24px; cursor:pointer;">⏮</button>
          <button id="playBtn" style="background:none; border:none; font-size:36px; cursor:pointer;">▶</button>
          <button id="nextTrack" style="background:none; border:none; font-size:24px; cursor:pointer;">⏭</button>
        </div>
      </div>
    </div>

    <!-- TELEFON APP -->
    <div class="app-overlay" id="phoneOverlay">
      <div class="app-head"><h3>Telefon</h3><button class="closebtn" id="phoneClose"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>
      <div style="flex:1; display:flex; flex-direction:column; gap:16px; padding:10px;">
        <div style="display:flex; align-items:center; gap:12px; padding:12px; background:var(--panel-2); border-radius:12px;">📞 Anna Weber</div>
        <div style="display:flex; align-items:center; gap:12px; padding:12px; background:var(--panel-2); border-radius:12px;">📞 Service Center</div>
        <div style="display:flex; align-items:center; gap:12px; padding:12px; background:var(--panel-2); border-radius:12px;">📞 Familie</div>
      </div>
    </div>

    <!-- CLIMATE APP -->
    <div class="app-overlay" id="climateOverlay">
      <div class="app-head"><h3>Klimatisierung</h3><button class="closebtn" id="climateClose"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>
      <div style="display:flex; gap:40px; align-items:center; justify-content:center; flex:1;">
        <div style="text-align:center;">
          <div style="font-size:14px; color:var(--text-dim);">Fahrer</div>
          <div style="font-size:48px; font-weight:700;" id="tempLval">21°</div>
          <div style="display:flex; gap:20px; margin-top:10px;">
            <button data-side="L" data-dir="1" style="font-size:24px; background:none; border:none; color:var(--text);">+</button>
            <button data-side="L" data-dir="-1" style="font-size:24px; background:none; border:none; color:var(--text);">-</button>
          </div>
        </div>
        <div style="text-align:center;">
          <div style="font-size:14px; color:var(--text-dim);">Beifahrer</div>
          <div style="font-size:48px; font-weight:700;" id="tempRval">21°</div>
          <div style="display:flex; gap:20px; margin-top:10px;">
            <button data-side="R" data-dir="1" style="font-size:24px; background:none; border:none; color:var(--text);">+</button>
            <button data-side="R" data-dir="-1" style="font-size:24px; background:none; border:none; color:var(--text);">-</button>
          </div>
        </div>
      </div>
    </div>

    <!-- SETTINGS APP -->
    <div class="settings-overlay" id="settingsOverlay">
      <button class="closebtn" id="settingsClose" style="position:absolute; top:20px; left:22px; z-index:5;"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
      <div class="settings-content" id="settingsContent"></div>
      <div class="settings-sidebar" id="settingsSidebar"></div>
    </div>

    <div class="toast-stack" id="toastStack"></div>
  </div>

  <!-- BOTTOM DOCK -->
  <div class="dock">
    <div class="temp-side" id="tempSideL">
      <button data-side="L" data-dir="1">+</button>
      <span class="temp-val" id="tempL">21°</span>
      <button data-side="L" data-dir="-1">-</button>
    </div>
    <button class="start-btn" id="btnStart" title="Start-Menü">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg>
    </button>
    <div class="temp-side" id="tempSideR">
      <button data-side="R" data-dir="1">+</button>
      <span class="temp-val" id="tempR">21°</span>
      <button data-side="R" data-dir="-1">-</button>
    </div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script>
  (function() {
    // ---------- STATE ----------
    const state = {
      theme: 'dark',
      gear: 'P',
      battery: 82,
      speed: 0,
      climate: { tempL: 21, tempR: 21, sync: true },
      software: { version: '2026.20.3', updateAvailable: true, updateVersion: '2026.24.1' }
    };

    // ---------- HELPERS ----------
    const $ = (id) => document.getElementById(id);
    function toast(msg) {
      const stack = $('toastStack');
      const el = document.createElement('div');
      el.className = 'toast';
      el.textContent = msg;
      stack.appendChild(el);
      setTimeout(() => el.remove(), 2500);
    }

    // ---------- THEME ----------
    $('btnTheme').addEventListener('click', () => {
      state.theme = state.theme === 'dark' ? 'light' : 'dark';
      document.documentElement.setAttribute('data-theme', state.theme);
      toast(state.theme === 'dark' ? 'Dunkelmodus' : 'Hellmodus');
    });

    // ---------- CLOCK ----------
    function tickClock() {
      const d = new Date();
      $('clock').textContent = `${d.getHours()}:${String(d.getMinutes()).padStart(2, '0')}`;
    }
    tickClock(); setInterval(tickClock, 10000);

    // ---------- GEAR ----------
    $('gearLetters').addEventListener('click', (e) => {
      if (e.target.tagName === 'BUTTON') {
        state.gear = e.target.dataset.g;
        document.querySelectorAll('#gearLetters button').forEach(b => b.classList.toggle('active', b.dataset.g === state.gear));
        if (state.gear === 'D') toast('Fahrbereit');
        else if (state.gear === 'P') toast('Geparkt');
      }
    });

    // ---------- CLIMATE (quick dock + full overlay) ----------
    function setTemp(side, dir) {
      const key = side === 'L' ? 'tempL' : 'tempR';
      state.climate[key] = Math.max(16, Math.min(28, state.climate[key] + dir * 0.5));
      if (state.climate.sync) state.climate.tempL = state.climate.tempR = state.climate[key];
      $('tempL').textContent = state.climate.tempL + '°';
      $('tempR').textContent = state.climate.tempR + '°';
      $('tempLval').textContent = state.climate.tempL + '°';
      $('tempRval').textContent = state.climate.tempR + '°';
    }
    document.querySelectorAll('.temp-side button, [data-side][data-dir]').forEach(btn => {
      btn.addEventListener('click', (e) => {
        e.stopPropagation();
        setTemp(btn.dataset.side, +btn.dataset.dir);
      });
    });

    // ---------- START MENU (Windows 11 style) ----------
    const apps = [
      { name: 'KAMERA', icon: '📷', action: () => $('cameraOverlay').classList.add('show') },
      { name: 'SPOTIFY', icon: '🎵', action: () => $('mediaOverlay').classList.add('show') },
      { name: 'KARTEN', icon: '🗺️', action: () => toast('Karten App geöffnet') },
      { name: 'TELEFON', icon: '📞', action: () => $('phoneOverlay').classList.add('show') },
      { name: 'EINSTELLUNGEN', icon: '⚙️', action: () => { $('settingsOverlay').classList.add('show'); renderSettings(); } }
    ];
    const grid = $('startMenuGrid');
    grid.innerHTML = apps.map(a => `
      <div class="app-tile" id="tile-${a.name}">
        <div class="aticon" style="background:#2c2f36;">${a.icon}</div>
        <div class="alabel">${a.name}</div>
      </div>`).join('');
    apps.forEach(a => $(`tile-${a.name}`).addEventListener('click', () => {
      $('startMenuOverlay').classList.remove('show');
      a.action();
    }));

    $('btnStart').addEventListener('click', () => $('startMenuOverlay').classList.toggle('show'));
    $('startMenuClose').addEventListener('click', () => $('startMenuOverlay').classList.remove('show'));

    // ---------- CLOSE ALL APP OVERLAYS ----------
    document.querySelectorAll('.closebtn').forEach(btn => {
      btn.addEventListener('click', () => {
        const overlay = btn.closest('.app-overlay, .settings-overlay');
        if (overlay) overlay.classList.remove('show');
      });
    });

    // ---------- SETTINGS WITH SOFTWARE UPDATE ----------
    function renderSettings() {
      $('settingsSidebar').innerHTML = `
        <div class="side-item active">Software</div>
        <div class="side-item">Anzeige</div>
        <div class="side-item">Fahren</div>`;
      $('settingsContent').innerHTML = `
        <h3 style="margin-bottom:16px;">Software & Service</h3>
        <p style="color:var(--text-dim); margin-bottom:12px;">Aktuelle Version: <strong>${state.software.version}</strong></p>
        ${state.software.updateAvailable ? `
          <div class="update-card">
            <div style="font-weight:700; font-size:16px;">Version ${state.software.updateVersion}</div>
            <p style="margin:8px 0; color:var(--text-dim);">Neue Funktionen, verbesserte Reichweitenvorhersage und Fehlerbehebungen.</p>
            <button class="ubtn" id="installUpdateBtn">JETZT INSTALLIEREN</button>
          </div>` : `<p style="color:var(--text-dim);">Deine Software ist auf dem neuesten Stand.</p>`}
        <div style="margin-top:24px;">
          <button id="resetSimBtn" style="background:var(--panel-2); border:1px solid var(--line); padding:10px 20px; border-radius:8px; cursor:pointer;">Simulator zurücksetzen</button>
        </div>`;

      const installBtn = $('installUpdateBtn');
      if (installBtn) installBtn.addEventListener('click', () => {
        if (state.gear !== 'P') { toast('Bitte parken (P) für Update.'); return; }
        installBtn.disabled = true;
        installBtn.textContent = 'Installation läuft...';
        let progress = 0;
        const interval = setInterval(() => {
          progress += 20;
          if (progress >= 100) {
            clearInterval(interval);
            state.software.version = state.software.updateVersion;
            state.software.updateAvailable = false;
            toast('✅ Update abgeschlossen! Version ' + state.software.version);
            renderSettings();
          } else {
            toast(`🔄 Installation... ${progress}%`);
          }
        }, 700);
      });

      const resetBtn = $('resetSimBtn');
      if (resetBtn) resetBtn.addEventListener('click', () => location.reload());
    }

    // ---------- MAP ----------
    try {
      const map = L.map('map', { zoomControl: false, attributionControl: false }).setView([52.9018, 8.4333], 13);
      L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19 }).addTo(map);
    } catch (e) { console.log('Map konnte nicht geladen werden.'); }

    // ---------- INIT ----------
    toast('Nova Dash bereit. Drücke den Start-Button unten in der Mitte.');
    $('btnSentry').addEventListener('click', () => {
      $('btnSentry').classList.toggle('danger');
      toast($('btnSentry').classList.contains('danger') ? 'Wächtermodus aktiv' : 'Wächtermodus aus');
    });
    $('btnBt').addEventListener('click', () => {
      $('btnBt').classList.toggle('on');
      toast($('btnBt').classList.contains('on') ? 'Bluetooth verbunden' : 'Bluetooth getrennt');
    });
  })();
</script>
</body>
</html>
